<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortKnox – Release Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .navbar, .card, .table {
            background-color: #161b22;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .card {
            border: 1px solid #30363d;
        }
        .table {
            color: #c9d1d9;
        }
        .table-dark {
            background-color: #161b22;
            border-color: #30363d;
        }
        .form-control, .form-select {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
            box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
        }
        .badge-movie { background-color: #238636; }
        .badge-tv { background-color: #1f6feb; }
        .badge-game { background-color: #8957e5; }
        .badge-default { background-color: #30363d; }

        /* FortKnox Metallic Neon – shared release-page identity */
        :root { color-scheme: dark; --fk-cyan:#38d9e8; --fk-green:#8bea35; --fk-line:rgba(105,220,224,.19); --fk-muted:#91a2b5; }
        body {
            color:#eaf4f7;
            background:radial-gradient(ellipse at 12% 0%,rgba(40,220,95,.12),transparent 35%),radial-gradient(ellipse at 88% 4%,rgba(22,191,225,.13),transparent 38%),linear-gradient(145deg,#070b12,#0a111c 52%,#080d16);
            background-attachment:fixed;
        }
        header,.navbar {
            background:linear-gradient(110deg,rgba(8,15,24,.98),rgba(13,25,37,.96)) !important;
            border-bottom:1px solid rgba(56,217,232,.28) !important;
            box-shadow:0 12px 42px rgba(0,0,0,.28),0 1px 22px rgba(38,210,198,.06);
        }
        header h1,.navbar-brand {
            color:#eaf8fb !important; font-weight:800; letter-spacing:.065em; text-transform:uppercase;
            background:linear-gradient(180deg,#fff 5%,#b4c4ce 52%,#718794 100%);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        header span { color:#a5bbc7; letter-spacing:.14em; text-transform:uppercase; font-size:10px; }
        main,.container { position:relative; }
        .card,.field {
            color:#eaf4f7 !important;
            background:linear-gradient(145deg,rgba(20,31,45,.95),rgba(11,18,29,.97)) !important;
            border:1px solid var(--fk-line) !important; border-radius:12px;
            box-shadow:inset 0 1px rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.2);
        }
        .card { position:relative; overflow:hidden; }
        .card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--fk-green),var(--fk-cyan),transparent); }
        .field { background:rgba(5,13,22,.58) !important; padding:15px; }
        .field-label,.event-meta,.loading,.release-title { color:var(--fk-muted) !important; }
        .field-label { letter-spacing:.11em; font-size:10px; }
        .field-value,.release-name { color:#edfaff; }
        .release-name { font-size:clamp(20px,3vw,28px); }
        h2,h5 { color:#eaf8fb; letter-spacing:.035em; text-transform:uppercase; }
        .back { color:var(--fk-cyan); }
        .event { background:rgba(5,13,22,.58); border-left-color:var(--fk-cyan); }
        .event-type { color:var(--fk-green); }
        .event-message { color:#d7e5ec; }
        .button { border:1px solid transparent; }
        .button-nuke { background:linear-gradient(135deg,#762b37,#b93b43); }
        .button-unnuke { background:linear-gradient(135deg,#1d593e,#398b42); }
        .form-control,.form-select { background:#0b1420 !important; border-color:rgba(124,174,190,.24) !important; color:#eaf4f7 !important; }
        .form-control:focus,.form-select:focus { border-color:var(--fk-cyan) !important; box-shadow:0 0 0 3px rgba(56,217,232,.12) !important; }
        .table,.table-dark { --bs-table-bg:transparent; --bs-table-color:#eaf4f7; --bs-table-border-color:rgba(105,220,224,.12); }
        .table thead th { color:#8fa8b7; text-transform:uppercase; letter-spacing:.1em; font-size:10px; background:rgba(39,62,77,.26); }
        .table-hover>tbody>tr:hover>* { --bs-table-accent-bg:rgba(41,207,201,.075); color:#fff; }
        .btn-outline-secondary { color:var(--fk-cyan); border-color:rgba(56,217,232,.4); }
        .btn-outline-secondary:hover { color:#fff; background:#15536a; border-color:var(--fk-green); }
        .badge-movie { background:#317d39; } .badge-tv { background:#146b7c; } .badge-game { background:#6550a8; }
        .text-info { color:var(--fk-cyan) !important; }
        @media (max-width:600px) { main { padding-left:14px; padding-right:14px; } .card { padding:18px !important; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/presite.html">FortKnox – Release Intelligence</a>
            <div class="d-flex">
                <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm">Live Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Stats Row -->
        <div class="row text-center mb-4" id="stats-row">
            <div class="col-md-3 mb-2">
                <div class="card p-3">
                    <div class="text-muted small">Releases Gesamt</div>
                    <div class="fs-4 fw-bold" id="stat-releases">-</div>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card p-3">
                    <div class="text-muted small">Release Groups</div>
                    <div class="fs-4 fw-bold" id="stat-groups">-</div>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card p-3">
                    <div class="text-muted small">Events</div>
                    <div class="fs-4 fw-bold" id="stat-events">-</div>
                </div>
            </div>
            <div class="col-md-3 mb-2">
                <div class="card p-3">
                    <div class="text-muted small">Nuked</div>
                    <div class="fs-4 fw-bold text-danger" id="stat-nuked">-</div>
                </div>
            </div>
        </div>

        <!-- Search & Filter Section -->
        <div class="card p-4 mb-4">
            <h5 class="mb-3">🔍 Release Suche</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="search-q" class="form-control" placeholder="Suche nach Name...">
                </div>
                <div class="col-md-3">
                    <select id="search-category" class="form-select">
                        <option value="">Alle Kategorien</option>
                        <option value="MOVIE">MOVIE</option>
                        <option value="TV">TV</option>
                        <option value="GAME">GAME</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" id="search-group" class="form-control" placeholder="Gruppe (z.B. GRP)">
                </div>
                <div class="col-md-2">
                    <button id="btn-search" class="btn btn-primary w-100">Suchen</button>
                </div>
            </div>
        </div>

        <!-- Releases Table -->
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">📋 Neueste Releases</h5>
                <span class="text-muted small" id="results-count">Lade...</span>
            </div>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Release Name</th>
                            <th>Gruppe</th>
                            <th>Kategorie</th>
                            <th>Auflösung</th>
                            <th>Source</th>
                            <th>Zeitpunkt</th>
                        </tr>
                    </thead>
                    <tbody id="releases-tbody">
                        <tr><td colspan="7" class="text-center text-muted">Lade Releases...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="btn-prev" class="btn btn-outline-secondary btn-sm" disabled>&larr; Zurück</button>
                <span id="page-indicator" class="text-muted small">Seite 1 / 1</span>
                <button id="btn-next" class="btn btn-outline-secondary btn-sm" disabled>Weiter &rarr;</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted py-4 mt-5 border-top border-secondary small">
        FortKnox PreDB Suite &bull; Public PreSite
    </footer>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadDashboardStats() {
            try {
                const res = await fetch('/api/dashboard');
                if (res.ok) {
                    const json = await res.json();
                    if (json.success && json.stats) {
                        document.getElementById('stat-releases').textContent = json.stats.releases ?? 0;
                        document.getElementById('stat-groups').textContent = json.stats.groups ?? 0;
                        document.getElementById('stat-events').textContent = json.stats.events ?? 0;
                        document.getElementById('stat-nuked').textContent = json.stats.nuked ?? 0;
                    }
                }
            } catch (e) {
                console.error('Fehler beim Laden der Stats:', e);
            }
        }

        async function loadReleases() {
            const q = document.getElementById('search-q').value.trim();
            const category = document.getElementById('search-category').value;
            const group = document.getElementById('search-group').value.trim();

            const params = new URLSearchParams({
                page: currentPage,
                limit: 20,
                sort: 'id',
                order: 'DESC'
            });

            if (q) params.set('q', q);
            if (category) params.set('category', category);
            if (group) params.set('group', group);

            try {
                const res = await fetch('/api/releases/search?' + params.toString());
                if (!res.ok) throw new Error('Netzwerkfehler');
                const data = await res.json();

                const tbody = document.getElementById('releases-tbody');
                tbody.innerHTML = '';

                document.getElementById('results-count').textContent = `${data.total || 0} Release(s) gefunden`;
                totalPages = data.pages || 1;
                document.getElementById('page-indicator').textContent = `Seite ${data.page || 1} / ${totalPages}`;
                document.getElementById('btn-prev').disabled = (data.page || 1) <= 1;
                document.getElementById('btn-next').disabled = (data.page || 1) >= totalPages;

                if (!data.releases || data.releases.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Keine Releases gefunden.</td></tr>';
                    return;
                }

                data.releases.forEach(r => {
                    const tr = document.createElement('tr');
                    
                    let badgeClass = 'badge-default';
                    if (r.category === 'MOVIE') badgeClass = 'badge-movie';
                    if (r.category === 'TV') badgeClass = 'badge-tv';
                    if (r.category === 'GAME') badgeClass = 'badge-game';

                    tr.innerHTML = `
                        <td>${r.id}</td>
                        <td class="fw-bold text-light">${escapeHtml(r.name)}</td>
                        <td><span class="text-info">${escapeHtml(r.group_name || '-') }</span></td>
                        <td><span class="badge ${badgeClass}">${escapeHtml(r.category || '-')}</span></td>
                        <td>${escapeHtml(r.resolution || '-')}</td>
                        <td>${escapeHtml(r.source || '-')}</td>
                        <td class="text-muted small">${escapeHtml(r.created_at || '-')}</td>
                    `;
                    tbody.append(tr);
                });

            } catch (e) {
                console.error('Fehler beim Laden der Releases:', e);
                document.getElementById('releases-tbody').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Fehler beim Laden der Releases.</td></tr>';
            }
        }

        function escapeHtml(str) {
            return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
        }

        document.getElementById('btn-search').addEventListener('click', () => {
            currentPage = 1;
            loadReleases();
        });

        document.getElementById('search-q').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                currentPage = 1;
                loadReleases();
            }
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadReleases();
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                loadReleases();
            }
        });

        // Init
        loadDashboardStats();
        loadReleases();
    </script>
<script>
    // Datensparsame Tageszählung: der Server speichert nur täglich wechselnde HMAC-Kennungen.
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/visits/track', new Blob([], { type: 'application/json' }));
    } else {
        fetch('/api/visits/track', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    }
</script>
</body>
</html>
