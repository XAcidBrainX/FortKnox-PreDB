<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FortKnox PreDB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: #e8eaed;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #171a21;
            border-bottom: 1px solid #292e38;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header span {
            color: #8b93a1;
            font-size: 13px;
        }

        main {
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card,
        .section {
            background: #171a21;
            border: 1px solid #292e38;
            border-radius: 10px;
        }

        .card {
            padding: 22px;
        }

        .card .label {
            color: #8b93a1;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            margin-bottom: 25px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 22px;
            border-bottom: 1px solid #292e38;
            font-size: 18px;
            font-weight: bold;
        }

        .section-body {
            padding: 20px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr) auto;
            gap: 10px;
        }

        input,
        select,
        button {
            height: 42px;
            border-radius: 6px;
            border: 1px solid #353b47;
            background: #20242d;
            color: #e8eaed;
            padding: 0 12px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6e7681;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            background: #303641;
        }

        button:hover {
            background: #3a414d;
        }

        .search-actions {
            display: flex;
            gap: 10px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .category {
            background: #20242d;
            border: 1px solid #303641;
            border-radius: 8px;
            padding: 15px 20px;
            min-width: 140px;
        }

        .category-name {
            color: #8b93a1;
            font-size: 12px;
        }

        .category-count {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .results-info {
            color: #8b93a1;
            font-size: 13px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #292e38;
            font-size: 14px;
        }

        th {
            color: #8b93a1;
            font-weight: normal;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.release-row {
            cursor: pointer;
        }

        tr.release-row:hover {
            background: #1e222a;
        }

        .release-name {
            font-weight: bold;
        }

        .metadata {
            color: #8b93a1;
            font-size: 12px;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 5px;
            background: #252a33;
            font-size: 12px;
        }

        .nuke {
            color: #ff7b72;
            font-weight: bold;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .pagination button {
            min-width: 100px;
        }

        .page-info {
            color: #8b93a1;
        }

        .status {
            color: #7ee787;
            font-size: 13px;
        }

        .error {
            color: #ff7b72;
            padding: 20px 0;
        }

        @media (max-width: 1100px) {
            .search-form {
                grid-template-columns: repeat(3, 1fr);
            }

            .search-form input {
                grid-column: span 3;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .search-form {
                grid-template-columns: 1fr;
            }

            .search-form input {
                grid-column: auto;
            }

            th:nth-child(1),
            td:nth-child(1),
            th:nth-child(5),
            td:nth-child(5) {
                display: none;
            }
        }


        /* FortKnox 1.2 - Live Release Feed */

        #live-feed-section {
            margin-bottom: 24px;
        }

        #live-feed-status {
            margin-top: 4px;
            font-size: 12px;
            color: #7f8aa3;
        }

        #live-feed-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 58px;
            height: 28px;
            padding: 0 10px;
            border-radius: 14px;
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.35);
            color: #2ecc71;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #live-feed {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .live-release {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .live-release:hover {
            background: rgba(255, 255, 255, 0.055);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .live-release strong {
            display: block;
            color: #f1f3f6;
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .live-release .metadata {
            margin-top: 5px;
        }

        .live-release-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex-shrink: 0;
            color: #7f8aa3;
            font-size: 11px;
            white-space: nowrap;
        }

        .live-release-meta span:first-child {
            color: #aab4c8;
            font-weight: 600;
        }

        .new-release-notification {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 9999;
            padding: 13px 18px;
            border-radius: 8px;
            background: #1b2230;
            border: 1px solid rgba(46, 204, 113, 0.45);
            color: #f1f3f6;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .new-release-notification.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 700px) {

            .live-release {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .live-release-meta {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                white-space: normal;
            }

            .new-release-notification {
                right: 12px;
                bottom: 12px;
                left: 12px;
                text-align: center;
            }

        }

.admin-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #252b36;
            color: #38bdf8;
            border: 1px solid #3b4455;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background: #333d4d;
            border-color: #38bdf8;
            color: #ffffff;
        }

        /* FortKnox Release Intelligence – Metallic Neon Dashboard */
        :root {
            color-scheme: dark;
            --fk-bg: #070b12;
            --fk-panel: rgba(16, 23, 34, .88);
            --fk-panel-strong: #111a27;
            --fk-line: rgba(105, 220, 224, .18);
            --fk-muted: #91a2b5;
            --fk-text: #eaf4f7;
            --fk-cyan: #38d9e8;
            --fk-green: #8bea35;
            --fk-glow: rgba(44, 218, 205, .18);
        }
        body {
            color: var(--fk-text);
            background:
                radial-gradient(ellipse at 12% 0%, rgba(40, 220, 95, .13), transparent 34%),
                radial-gradient(ellipse at 88% 4%, rgba(22, 191, 225, .14), transparent 38%),
                linear-gradient(145deg, #070b12 0%, #0a111c 48%, #080d16 100%);
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .16;
            background-image: linear-gradient(rgba(93, 196, 205, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(93, 196, 205, .08) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
        }
        header {
            position: relative;
            z-index: 1;
            padding: 22px clamp(18px, 4vw, 56px);
            background: linear-gradient(110deg, rgba(8, 15, 24, .97), rgba(13, 25, 37, .94));
            border-bottom: 1px solid rgba(56, 217, 232, .28);
            box-shadow: 0 12px 42px rgba(0,0,0,.32), 0 1px 22px rgba(38,210,198,.06);
        }
        header h1 {
            font-size: clamp(26px, 3vw, 38px);
            line-height: 1.05;
            letter-spacing: .055em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 5%, #aebdc8 48%, #647985 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 24px rgba(56,217,232,.12);
        }
        header span {
            display: block;
            margin-top: 8px;
            color: #a5bbc7;
            letter-spacing: .17em;
            text-transform: uppercase;
            font-size: 10px;
        }
        main { position: relative; z-index: 1; max-width: 1580px; padding: 30px clamp(16px, 3vw, 42px) 56px; }
        .card, .section, .category {
            background: linear-gradient(145deg, rgba(20, 31, 45, .94), rgba(11, 18, 29, .96));
            border: 1px solid var(--fk-line);
            border-radius: 12px;
            box-shadow: inset 0 1px rgba(255,255,255,.035), 0 12px 30px rgba(0,0,0,.2);
        }
        .card { position: relative; overflow: hidden; padding: 23px 24px; }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--fk-green), var(--fk-cyan), transparent);
            opacity: .8;
        }
        .card .label, .category-name { color: var(--fk-muted); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
        .card .value { margin-top: 7px; font-size: clamp(28px, 3vw, 38px); color: #f0fbff; text-shadow: 0 0 20px rgba(56,217,232,.16); font-variant-numeric: tabular-nums; }
        .section { margin-bottom: 22px; overflow: hidden; }
        .section-header {
            min-height: 58px;
            padding: 17px 22px;
            color: #eaf8fb;
            background: linear-gradient(90deg, rgba(33, 53, 67, .48), rgba(15, 26, 39, .18));
            border-bottom: 1px solid var(--fk-line);
            letter-spacing: .045em;
        }
        .section-header h2 { margin: 0; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
        .section-body { padding: 22px; }
        input, select, button {
            border: 1px solid rgba(124, 174, 190, .24);
            border-radius: 7px;
            background: #0b1420;
            color: var(--fk-text);
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }
        input::placeholder { color: #718597; }
        input:focus, select:focus { outline: none; border-color: var(--fk-cyan); box-shadow: 0 0 0 3px rgba(56,217,232,.12); }
        button {
            background: linear-gradient(135deg, #173b43, #153044);
            border-color: rgba(56,217,232,.4);
            color: #eaffff;
            letter-spacing: .025em;
        }
        button:hover:not(:disabled) { background: linear-gradient(135deg, #205b4a, #15536a); border-color: var(--fk-green); box-shadow: 0 0 18px rgba(56,217,232,.13); }
        button:disabled { opacity: .35; cursor: not-allowed; }
        .admin-btn {
            background: rgba(18, 39, 50, .8);
            border: 1px solid rgba(56,217,232,.42);
            color: var(--fk-cyan);
            padding: 10px 17px;
        }
        .admin-btn:hover { background: rgba(22, 65, 70, .85); border-color: var(--fk-green); color: white; }
        .category { min-width: 145px; padding: 16px 19px; }
        .category-count { margin-top: 8px; color: var(--fk-green); font-size: 26px; text-shadow: 0 0 16px rgba(139,234,53,.16); }
        .results-info, .metadata, .page-info { color: var(--fk-muted); }
        table { border-collapse: separate; border-spacing: 0; }
        th { color: #8fa8b7; text-transform: uppercase; letter-spacing: .1em; font-size: 10px; background: rgba(39, 62, 77, .26); }
        th, td { border-bottom: 1px solid rgba(105, 220, 224, .11); padding: 14px 12px; }
        tr.release-row { transition: background .16s ease; }
        tr.release-row:hover { background: rgba(41, 207, 201, .075); }
        .release-name { color: #e9f8fb; }
        .badge { color: #a9eff0; background: rgba(40, 164, 175, .12); border: 1px solid rgba(56,217,232,.22); border-radius: 5px; }
        .status { color: var(--fk-green); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
        #live-feed-indicator { color: var(--fk-green); background: rgba(139,234,53,.09); border-color: rgba(139,234,53,.36); box-shadow: 0 0 16px rgba(139,234,53,.08); }
        .live-release { background: rgba(5, 13, 22, .5); border-color: rgba(105,220,224,.13); }
        .live-release:hover { background: rgba(20, 54, 62, .45); border-color: rgba(56,217,232,.4); }
        .live-release strong { color: #eaf8fb; }
        .live-release-meta span:first-child { color: var(--fk-cyan); }
        .new-release-notification { background: #10242b; border-color: rgba(139,234,53,.48); }
        .error { color: #ff8585; }
        @media (max-width: 700px) {
            header { gap: 14px; align-items: flex-start; }
            header span { max-width: 240px; line-height: 1.5; }
            .section-body { padding: 15px; }
            .card { padding: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
        }
    </style>
</head>

<body>

<header>
    <div class="fk-dashboard-brand">
        <h1>FortKnox</h1>
        <span>Release Intelligence &amp; Control Center</span>
    </div>
    <a href="/admin.html" class="admin-btn">🔒 Admin Login</a>
</header>

<main>

    <!-- STATS -->

    <div class="stats">

        <div class="card">
            <div class="label">Releases</div>
            <div class="value" id="releases">-</div>
        </div>

        <div class="card">
            <div class="label">Groups</div>
            <div class="value" id="groups">-</div>
        </div>

        <div class="card">
            <div class="label">Events</div>
            <div class="value" id="events">-</div>
        </div>

        <div class="card">
            <div class="label">Nuked</div>
            <div class="value" id="nuked">-</div>
        </div>

    </div>


    <!-- SEARCH -->

    <div class="section">

        <div class="section-header">
            🔎 Release Search
        </div>

        <div class="section-body">

            <form
                id="search-form"
                class="search-form"
            >

                <input
                    type="text"
                    id="search"
                    placeholder="Release, Titel, Group, Sprache ..."
                >

                <select id="category">
                    <option value="">Kategorie</option>
                    <option value="MOVIE">MOVIE</option>
                    <option value="TV">TV</option>
                    <option value="GAME">GAME</option>
                    <option value="MUSIC">MUSIC</option>
                    <option value="APP">APP</option>
                    <option value="BOOK">BOOK</option>
                </select>

                <input
                    type="number"
                    id="year"
                    placeholder="Jahr"
                    min="1900"
                    max="2100"
                >

                <input
                    type="text"
                    id="group"
                    placeholder="Group"
                >

                <select id="resolution">
                    <option value="">Auflösung</option>
                    <option value="2160p">2160p</option>
                    <option value="1080p">1080p</option>
                    <option value="720p">720p</option>
                    <option value="576p">576p</option>
                    <option value="480p">480p</option>
                </select>

                <select id="language">
                    <option value="">Sprache</option>
                    <option value="GERMAN">GERMAN</option>
                    <option value="ENGLISH">ENGLISH</option>
                    <option value="FRENCH">FRENCH</option>
                    <option value="SPANISH">SPANISH</option>
                    <option value="ITALIAN">ITALIAN</option>
                    <option value="DUTCH">DUTCH</option>
                    <option value="MULTI">MULTI</option>
                </select>

                <select id="codec">
                    <option value="">Codec</option>
                    <option value="x265">x265</option>
                    <option value="x264">x264</option>
                    <option value="HEVC">HEVC</option>
                    <option value="AV1">AV1</option>
                    <option value="XviD">XviD</option>
                </select>

                <div class="search-actions">
                    <button type="submit">
                        Suchen
                    </button>

                    <button
                        type="button"
                        id="reset-search"
                    >
                        Reset
                    </button>
                </div>

            </form>

        </div>

    </div>


    <!-- SEARCH RESULTS -->

    <div class="section">

        <div class="section-header">
            📋 Releases
        </div>

        <div class="section-body">

            <div
                class="results-info"
                id="results-info"
            >
                Wird geladen...
            </div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Release</th>
                        <th>Veröffentlicht</th>
                        <th>Group</th>
                        <th>Kategorie</th>
                        <th>Jahr</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="releases-table">
                </tbody>

            </table>

            <div class="pagination">

                <button
                    type="button"
                    id="previous"
                >
                    ← Zurück
                </button>

                <span
                    class="page-info"
                    id="page-info"
                >
                    Seite 1
                </span>

                <button
                    type="button"
                    id="next"
                >
                    Weiter →
                </button>

            </div>

        </div>

    </div>


    <!-- CATEGORIES -->

    <div class="section">

        <div class="section-header">
            Kategorien
        </div>

        <div class="section-body">

            <div
                class="categories"
                id="categories"
            >
                Wird geladen...
            </div>

        </div>

    </div>


    <div class="status">
        ● FortKnox API verbunden
    </div>

</main>


<script>

let currentPage = 1;
let totalPages = 1;

let liveFeedInitialized = false;
let lastKnownReleaseId = 0;
let liveRefreshTimer = null;


function escapeHtml(value) {

    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}


function ensureLiveFeed() {

    if (document.getElementById('live-feed')) {
        return;
    }

    const section = document.createElement('section');

    section.id = 'live-feed-section';
    section.className = 'section';

    section.innerHTML = `
        <div class="section-header">
            <div>
                <h2>Live Release Feed</h2>
                <div id="live-feed-status">
                    Initialisiere Live-Feed...
                </div>
            </div>

            <div id="live-feed-indicator">
                LIVE
            </div>
        </div>

        <div id="live-feed"></div>
    `;

    const searchForm =
        document.getElementById('search-form');

    if (searchForm && searchForm.parentElement) {
        searchForm.parentElement.parentElement.insertBefore(
            section,
            searchForm.parentElement
        );
    } else {
        document.body.prepend(section);
    }
}


function formatReleaseTime(value) {

    if (!value) {
        return '-';
    }

    const date = new Date(
        value.replace(' ', 'T')
    );

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString(
        'de-DE',
        {
            dateStyle: 'short',
            timeStyle: 'medium'
        }
    );
}


function renderLiveFeed(releases) {

    ensureLiveFeed();
    liveFeedInitialized = true;

    const feed =
        document.getElementById('live-feed');

    const status =
        document.getElementById('live-feed-status');

    if (!releases || !releases.length) {

        feed.innerHTML =
            '<div class="metadata">Noch keine Releases vorhanden.</div>';

        status.textContent =
            'Keine Releases';

        return;
    }


    const newestId =
        Math.max(
            ...releases.map(
                release => Number(release.id) || 0
            )
        );


    if (
        liveFeedInitialized &&
        newestId > lastKnownReleaseId
    ) {

        const count =
            newestId - lastKnownReleaseId;

        showNewReleaseNotification(
            count > 0 ? count : 1
        );
    }


    if (newestId > lastKnownReleaseId) {
        lastKnownReleaseId = newestId;
    }


    liveFeedInitialized = true;


    feed.innerHTML = releases
        .slice(0, 10)
        .map(release => {

            const metadata = [
                release.category,
                release.resolution,
                release.codec,
                release.language,
                release.source
            ]
            .filter(Boolean)
            .join(' • ');

            return `
                <div class="live-release"
                     data-release-id="${escapeHtml(release.id)}">

                    <div>
                        <strong>
                            ${escapeHtml(release.name)}
                        </strong>

                        <div class="metadata">
                            ${escapeHtml(metadata)}
                        </div>
                    </div>

                    <div class="live-release-meta">
                        <span>
                            #${escapeHtml(release.id)}
                        </span>

                        <span>
                            ${escapeHtml(
                                release.group_name || '-'
                            )}
                        </span>

                        <span>
                            ${formatReleaseTime(
                                release.created_at
                            )}
                        </span>
                    </div>

                </div>
            `;

        })
        .join('');


    document.querySelectorAll(
        '.live-release'
    ).forEach(element => {

        element.addEventListener(
            'click',
            () => {

                const id =
                    element.dataset.releaseId;

                window.location.href =
                    '/release.html?id=' +
                    encodeURIComponent(id);
            }
        );

    });
}


function showNewReleaseNotification(count) {

    let notification =
        document.getElementById(
            'new-release-notification'
        );

    if (!notification) {

        notification =
            document.createElement('div');

        notification.id =
            'new-release-notification';

        notification.className =
            'new-release-notification';

        document.body.appendChild(
            notification
        );
    }


    notification.textContent =
        count === 1
            ? '1 neues Release verfügbar'
            : count + ' neue Releases verfügbar';


    notification.classList.add('visible');


    window.setTimeout(
        () => {
            notification.classList.remove(
                'visible'
            );
        },
        5000
    );
}


function updateLiveStatus() {

    const status =
        document.getElementById(
            'live-feed-status'
        );

    if (!status) {
        return;
    }

    status.textContent =
        'Live • Letzte Aktualisierung: ' +
        new Date().toLocaleTimeString('de-DE');

}


async function loadDashboard() {

    try {

        const response =
            await fetch(
                '/api/dashboard',
                {
                    cache: 'no-store'
                }
            );

        if (!response.ok) {
            throw new Error(
                'HTTP ' + response.status
            );
        }

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                data.error || 'Dashboard error'
            );
        }


        document.getElementById('releases')
            .textContent =
            data.stats.releases;

        document.getElementById('groups')
            .textContent =
            data.stats.groups;

        document.getElementById('events')
            .textContent =
            data.stats.events;

        document.getElementById('nuked')
            .textContent =
            data.stats.nuked;


        const categories =
            document.getElementById(
                'categories'
            );

        categories.innerHTML = '';


        for (const category of data.categories) {

            const element =
                document.createElement('div');

            element.className =
                'category';

            element.innerHTML = `
                <div class="category-name">
                    ${escapeHtml(category.category)}
                </div>

                <div class="category-count">
                    ${category.count}
                </div>
            `;

            categories.appendChild(element);
        }


        renderLiveFeed(
            data.recent_releases || []
        );

        updateLiveStatus();


    } catch (error) {

        console.error(error);

        const status =
            document.getElementById(
                'live-feed-status'
            );

        if (status) {
            status.textContent =
                'Live-Feed nicht erreichbar';
        }

    }
}


async function searchReleases() {

    const params =
        new URLSearchParams();

    const q =
        document.getElementById('search').value.trim();

    const category =
        document.getElementById('category').value;

    const year =
        document.getElementById('year').value;

    const group =
        document.getElementById('group').value.trim();

    const resolution =
        document.getElementById('resolution').value;

    const language =
        document.getElementById('language').value;

    const codec =
        document.getElementById('codec').value;


    if (q) {
        params.set('q', q);
    }

    if (category) {
        params.set('category', category);
    }

    if (year) {
        params.set('year', year);
    }

    if (group) {
        params.set('group', group);
    }

    if (resolution) {
        params.set('resolution', resolution);
    }

    if (language) {
        params.set('language', language);
    }

    if (codec) {
        params.set('codec', codec);
    }


    params.set('page', currentPage);
    params.set('limit', '25');
    params.set('sort', 'id');
    params.set('order', 'DESC');


    const url =
        '/api/releases/search?' +
        params.toString();


    try {

        const response =
            await fetch(
                url,
                {
                    cache: 'no-store'
                }
            );

        if (!response.ok) {
            throw new Error(
                'HTTP ' + response.status
            );
        }

        const data =
            await response.json();

        if (!data.success) {
            throw new Error(
                data.error || 'Search error'
            );
        }

        renderResults(data);

    } catch (error) {

        console.error(error);

        document.getElementById(
            'results-info'
        ).textContent =
            'Fehler bei der Suche.';

        document.getElementById(
            'releases-table'
        ).innerHTML =
            '<tr><td colspan="7" class="error">API nicht erreichbar.</td></tr>';

    }
}


function renderResults(data) {

    const table =
        document.getElementById(
            'releases-table'
        );

    table.innerHTML = '';


    document.getElementById(
        'results-info'
    ).textContent =
        `${data.total} Release(s) gefunden`;


    totalPages =
        data.pages || 1;


    document.getElementById(
        'page-info'
    ).textContent =
        `Seite ${data.page} / ${totalPages}`;


    document.getElementById(
        'previous'
    ).disabled =
        data.page <= 1;


    document.getElementById(
        'next'
    ).disabled =
        data.page >= totalPages;


    if (!data.releases.length) {

        table.innerHTML =
            '<tr><td colspan="7">Keine Releases gefunden.</td></tr>';

        return;
    }


    for (const release of data.releases) {

        const row =
            document.createElement('tr');

        row.className =
            'release-row';


        row.addEventListener(
            'click',
            () => {
                window.location.href =
                    '/release.html?id=' +
                    encodeURIComponent(release.id);
            }
        );


        const metadata = [
            release.resolution,
            release.codec,
            release.language,
            release.source
        ]
        .filter(Boolean)
        .join(' • ');


        row.innerHTML = `

            <td>
                ${release.id}
            </td>

            <td>

                <div class="release-name">
                    ${escapeHtml(release.name)}
                </div>

                <div class="metadata">
                    ${escapeHtml(metadata)}
                </div>

            </td>

            <td>
                ${escapeHtml(formatReleaseTime(release.created_at))}
            </td>

            <td>
                ${escapeHtml(
                    release.group_name || '-'
                )}
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(
                        release.category || '-'
                    )}
                </span>
            </td>

            <td>
                ${release.year || '-'}
            </td>

            <td>
                ${
                    Number(release.nuke) === 1
                        ? '<span class="nuke">NUKED</span>'
                        : 'OK'
                }
            </td>

        `;


        table.appendChild(row);
    }
}


document.getElementById(
    'search-form'
).addEventListener(
    'submit',
    function(event) {

        event.preventDefault();

        currentPage = 1;

        searchReleases();
    }
);


document.getElementById(
    'reset-search'
).addEventListener(
    'click',
    function() {

        document.getElementById(
            'search-form'
        ).reset();

        currentPage = 1;

        searchReleases();
    }
);


document.getElementById(
    'previous'
).addEventListener(
    'click',
    function() {

        if (currentPage > 1) {

            currentPage--;

            searchReleases();
        }
    }
);


document.getElementById(
    'next'
).addEventListener(
    'click',
    function() {

        if (currentPage < totalPages) {

            currentPage++;

            searchReleases();
        }
    }
);


loadDashboard();
searchReleases();

if (liveRefreshTimer) {
    clearInterval(liveRefreshTimer);
}

liveRefreshTimer =
    window.setInterval(
        pollLiveReleases,
        5000
    );

async function pollLiveReleases() {
    if (!liveFeedInitialized) {
        return;
    }

    const status = document.getElementById('live-feed-status');
    const indicator = document.getElementById('live-feed-indicator');

    try {
        const response = await fetch('/api/releases/live?after_id=' + encodeURIComponent(lastKnownReleaseId), {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        if (!data.success) {
            throw new Error(data.error || 'Live API Fehler');
        }

        const releases = Array.isArray(data.releases) ? data.releases : [];

        if (!releases.length) {
            if (status) {
                status.textContent = 'Live • Keine neuen Releases • ' + new Date().toLocaleTimeString('de-DE');
            }
            if (indicator) {
                indicator.textContent = 'LIVE';
            }
            return;
        }

        const feed = document.getElementById('live-feed');
        if (!feed) return;

        const sorted = [...releases].sort((a, b) => Number(b.id) - Number(a.id));
        const fragment = document.createDocumentFragment();

        sorted.forEach(release => {
            if (typeof createLiveReleaseElement === 'function') {
                fragment.appendChild(createLiveReleaseElement(release));
            }
        });

        feed.prepend(fragment);

        const items = feed.querySelectorAll('.live-release');
        items.forEach((element, index) => {
            if (index >= 10) {
                element.remove();
            }
        });

        const newestId = Math.max(...releases.map(release => Number(release.id) || 0));
        if (newestId > lastKnownReleaseId) {
            lastKnownReleaseId = newestId;
        }

        if (status) {
            status.textContent = 'Live • ' + releases.length + ' neue • ' + new Date().toLocaleTimeString('de-DE');
        }

    } catch (error) {
        console.error('Live-Feed Polling Fehler:', error);
        if (status) status.textContent = 'Live-Feed nicht erreichbar';
        if (indicator) indicator.textContent = 'OFFLINE';
    }
}

    if (navigator.sendBeacon) {

    } else {

    }
