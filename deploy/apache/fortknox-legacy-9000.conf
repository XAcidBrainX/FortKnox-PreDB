# Legacy-Weiterleitung fuer die frueher genutzte Lounge-URL
# https://fortknox.cloud:9000/  ->  https://fortknox.cloud/monitor/irc-fish/
#
# The Lounge selbst lauscht nur auf 127.0.0.1:9001 und wird von Apache
# unter /monitor/irc-fish/ veroeffentlicht. Dieser vHost haelt alte
# Lesezeichen und Clients auf Port 9000 am Leben.

Listen 9000

<VirtualHost *:9000>
    ServerName fortknox.cloud
    ServerAlias www.fortknox.cloud fk-predb.com www.fk-predb.com predb.x4all.de

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/fk-predb.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fk-predb.com/privkey.pem

    Redirect permanent / https://fortknox.cloud/monitor/irc-fish/

    ErrorLog ${APACHE_LOG_DIR}/fortknox-legacy-9000-error.log
    CustomLog ${APACHE_LOG_DIR}/fortknox-legacy-9000-access.log combined
</VirtualHost>
