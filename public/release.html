<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortKnox – Release Intelligence</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1115;
            color: #e8e8e8;
        }
        header {
            background: #171a21;
            border-bottom: 1px solid #2a2f38;
            padding: 18px 30px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header span { color: #888; font-size: 13px; }
        main { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .back { display: inline-block; margin-bottom: 20px; color: #6ea8fe; text-decoration: none; }
        .back:hover { text-decoration: underline; }
        .card {
            background: #171a21;
            border: 1px solid #2a2f38;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .release-name { font-size: 22px; font-weight: bold; word-break: break-word; margin-bottom: 8px; }
        .release-title { color: #999; font-size: 15px; margin-bottom: 24px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .field {
            background: #101217;
            border: 1px solid #252a32;
            border-radius: 8px;
            padding: 14px;
        }
        .field-label { color: #777; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
        .field-value { font-size: 15px; word-break: break-word; }
        .nuke { color: #ff6b6b; font-weight: bold; }
        .clean { color: #69db7c; font-weight: bold; }
        h2 { margin-top: 0; font-size: 20px; }
        .event {
            border-left: 3px solid #444;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #101217;
            border-radius: 0 7px 7px 0;
        }
        .event-type { font-weight: bold; text-transform: uppercase; font-size: 13px; margin-bottom: 5px; }
        .event-message { color: #ccc; margin-bottom: 5px; }
        .event-meta { color: #666; font-size: 12px; }
        .actions { display: flex; gap: 12px; margin: 20px 0 24px; flex-wrap: wrap; }
        .button { border: 0; border-radius: 7px; padding: 11px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .button-nuke { background: #c92a2a; color: #fff; }
        .button-nuke:hover { background: #e03131; }
        .button-unnuke { background: #2b8a3e; color: #fff; }
        .button-unnuke:hover { background: #37b24d; }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { background: #351b1b; border: 1px solid #702525; color: #ff8787; padding: 16px; border-radius: 8px; }
        .loading { color: #888; padding: 20px 0; }

        /* FortKnox Metallic Neon – shared release-page identity */
        :root { color-scheme: dark; --fk-cyan:#38d9e8; --fk-green:#8bea35; --fk-line:rgba(105,220,224,.19); --fk-muted:#91a2b5; }
        body {
            color:#eaf4f7;
            background:radial-gradient(ellipse at 12% 0%,rgba(40,220,95,.12),transparent 35%),radial-gradient(ellipse at 88% 4%,rgba(22,191,225,.13),transparent 38%),linear-gradient(145deg,#070b12,#0a111c 52%,#080d16);
            background-attachment:fixed;
        }
        header,.navbar {
            background:linear-gradient(110deg,rgba(8,15,24,.98),rgba(13,25,37,.96)) !important;
            border-bottom:1px solid rgba(56,217,232,.28) !important;
            box-shadow:0 12px 42px rgba(0,0,0,.28),0 1px 22px rgba(38,210,198,.06);
        }
        header h1,.navbar-brand {
            color:#eaf8fb !important; font-weight:800; letter-spacing:.065em; text-transform:uppercase;
            background:linear-gradient(180deg,#fff 5%,#b4c4ce 52%,#718794 100%);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
        }
        header span { color:#a5bbc7; letter-spacing:.14em; text-transform:uppercase; font-size:10px; }
        main,.container { position:relative; }
        .card,.field {
            color:#eaf4f7 !important;
            background:linear-gradient(145deg,rgba(20,31,45,.95),rgba(11,18,29,.97)) !important;
            border:1px solid var(--fk-line) !important; border-radius:12px;
            box-shadow:inset 0 1px rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.2);
        }
        .card { position:relative; overflow:hidden; }
        .card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--fk-green),var(--fk-cyan),transparent); }
        .field { background:rgba(5,13,22,.58) !important; padding:15px; }
        .field-label,.event-meta,.loading,.release-title { color:var(--fk-muted) !important; }
        .field-label { letter-spacing:.11em; font-size:10px; }
        .field-value,.release-name { color:#edfaff; }
        .release-name { font-size:clamp(20px,3vw,28px); }
        h2,h5 { color:#eaf8fb; letter-spacing:.035em; text-transform:uppercase; }
        .back { color:var(--fk-cyan); }
        .event { background:rgba(5,13,22,.58); border-left-color:var(--fk-cyan); }
        .event-type { color:var(--fk-green); }
        .event-message { color:#d7e5ec; }
        .button { border:1px solid transparent; }
        .button-nuke { background:linear-gradient(135deg,#762b37,#b93b43); }
        .button-unnuke { background:linear-gradient(135deg,#1d593e,#398b42); }
        .form-control,.form-select { background:#0b1420 !important; border-color:rgba(124,174,190,.24) !important; color:#eaf4f7 !important; }
        .form-control:focus,.form-select:focus { border-color:var(--fk-cyan) !important; box-shadow:0 0 0 3px rgba(56,217,232,.12) !important; }
        .table,.table-dark { --bs-table-bg:transparent; --bs-table-color:#eaf4f7; --bs-table-border-color:rgba(105,220,224,.12); }
        .table thead th { color:#8fa8b7; text-transform:uppercase; letter-spacing:.1em; font-size:10px; background:rgba(39,62,77,.26); }
        .table-hover>tbody>tr:hover>* { --bs-table-accent-bg:rgba(41,207,201,.075); color:#fff; }
        .btn-outline-secondary { color:var(--fk-cyan); border-color:rgba(56,217,232,.4); }
        .btn-outline-secondary:hover { color:#fff; background:#15536a; border-color:var(--fk-green); }
        .badge-movie { background:#317d39; } .badge-tv { background:#146b7c; } .badge-game { background:#6550a8; }
        .text-info { color:var(--fk-cyan) !important; }
        @media (max-width:600px) { main { padding-left:14px; padding-right:14px; } .card { padding:18px !important; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
    </style>
</head>
<body>

<header>
    <h1>FortKnox</h1>
    <span>Release Intelligence &amp; Control Center</span>
</header>

<main>
    <a class="back" href="/dashboard.html">← Zurück zum Dashboard</a>
    <div id="content">
        <div class="loading">Lade Release...</div>
    </div>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const releaseId = params.get('id');
    const content = document.getElementById('content');

    function escapeHtml(value) {
        if (value === null || value === undefined) return '—';
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function field(label, value) {
        return `
            <div class="field">
                <div class="field-label">${escapeHtml(label)}</div>
                <div class="field-value">${escapeHtml(value)}</div>
            </div>
        `;
    }

    function renderRelease(data) {
        const release = data.release;
        const events = data.events || [];
        const isNuked = Number(release.nuke) === 1;
        const nukeStatus = isNuked ? '<span class="nuke">NUKED</span>' : '<span class="clean">CLEAN</span>';

        let eventsHtml = '';
        if (events.length === 0) {
            eventsHtml = '<div class="loading">Keine Events vorhanden.</div>';
        } else {
            eventsHtml = events.map(event => {
                const type = String(event.event_type || '').toLowerCase();
                return `
                    <div class="event event-${escapeHtml(type)}">
                        <div class="event-type">${escapeHtml(event.event_type)}</div>
                        <div class="event-message">${escapeHtml(event.message)}</div>
                        <div class="event-meta">Quelle: ${escapeHtml(event.source)} &nbsp;|&nbsp; ${escapeHtml(event.created_at)}</div>
                    </div>
                `;
            }).join('');
        }

        content.innerHTML = `
            <div class="card">
                <div class="release-name">${escapeHtml(release.name)}</div>
                <div class="release-title">${escapeHtml(release.title)}</div>

                <div class="actions">
                    ${isNuked 
                        ? `<button id="unnukeButton" class="button button-unnuke" onclick="changeNukeStatus('unnuke')">UNNUKE</button>`
                        : `<button id="nukeButton" class="button button-nuke" onclick="changeNukeStatus('nuke')">NUKE</button>`
                    }
                </div>

                <div class="grid">
                    ${field('ID', release.id)}
                    ${field('Kategorie', release.category)}
                    ${field('Jahr', release.year)}
                    ${field('Gruppe', release.group_name)}
                    ${field('Auflösung', release.resolution)}
                    ${field('Codec', release.codec)}
                    ${field('Sprache', release.language)}
                    ${field('Source', release.source)}
                    ${field('Season', release.season)}
                    ${field('Episode', release.episode)}
                    ${field('Größe', release.size_bytes)}
                    ${field('Erstellt', release.created_at)}
                    ${field('Aktualisiert', release.updated_at)}
                    <div class="field">
                        <div class="field-label">Status</div>
                        <div class="field-value">${nukeStatus}</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Event-History</h2>
                ${eventsHtml}
            </div>
        `;
    }

    async function changeNukeStatus(action) {
        const button = document.getElementById(action === 'nuke' ? 'nukeButton' : 'unnukeButton');
        if (button) button.disabled = true;

        try {
            const response = await fetch('/api/releases/' + encodeURIComponent(releaseId) + '/' + action, {
                method: 'POST'
            });
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Aktion fehlgeschlagen.');
            }

            await loadRelease();
        } catch (error) {
            alert(error.message);
            if (button) button.disabled = false;
        }
    }

    async function loadRelease() {
        if (!releaseId) {
            content.innerHTML = '<div class="error">Keine Release-ID angegeben.</div>';
            return;
        }

        try {
            const response = await fetch('/api/releases/' + encodeURIComponent(releaseId));
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Release konnte nicht geladen werden.');
            }

            renderRelease(data);
            document.title = 'FortKnox PreDB – ' + data.release.name;
        } catch (error) {
            content.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        }
    }

    loadRelease();
</script>

<script>
    // Datensparsame Tageszählung: der Server speichert nur täglich wechselnde HMAC-Kennungen.
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/visits/track', new Blob([], { type: 'application/json' }));
    } else {
        fetch('/api/visits/track', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    }
</script>
</body>
</html>
